version: '3.8'

services:
  # --- 1. Database: MySQL ---
  mysql-db:
    image: mysql:8.0
    container_name: agms-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=agms_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - agms-network

  # --- 2. Database: MongoDB ---
  mongodb-db:
    image: mongo:latest
    container_name: agms-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - agms-network

  # --- 3. Discovery Server (Eureka) ---
  discovery-server:
    image: visun12/discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - agms-network

  # --- 4. Config Server ---
  config-server:
    image: visun12/config-server
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      - discovery-server
    environment:
      - SPRING_CLOUD_CONFIG_SERVER_GIT_URI=https://github.com/Visun517/AGMS-config-repo.git
    networks:
      - agms-network

  # --- 5. API Gateway ---
  api-gateway:
    image: visun12/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
      - config-server
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - agms-network

  # --- 6. Identity Service (MySQL) ---
  identity-service:
    image: visun12/identity-service
    container_name: identity-service
    depends_on:
      - config-server
      - mysql-db
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - agms-network

  # --- 7. Crop Service (MongoDB) ---
  crop-service:
    image: visun12/crop-service
    container_name: crop-service
    depends_on:
      - config-server
      - mongodb-db
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - agms-network

  # --- 8. Zone Service (MySQL) ---
  zone-service:
    image: visun12/zone-service
    container_name: zone-service
    depends_on:
      - config-server
      - mysql-db
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - agms-network

  # --- 9. Sensor Service (IoT) ---
  sensor-service:
    image: visun12/sensor-service
    container_name: sensor-service
    depends_on:
      - config-server
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - agms-network

  # --- 10. Automation Service (MongoDB) ---
  automation-service:
    image: visun12/automation-service
    container_name: automation-service
    depends_on:
      - config-server
      - mongodb-db
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - agms-network

networks:
  agms-network:
    driver: bridge

volumes:
  mysql_data:
  mongo_data: