name: AGMS CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Images
        run: |
          # Infrastructure Services
          docker build -t visun12/discovery-server ./infrastructure-services/discovery-server
          docker push visun12/discovery-server
          
          docker build -t visun12/config-server ./infrastructure-services/config-server
          docker push visun12/config-server
          
          docker build -t visun12/api-gateway ./infrastructure-services/api-gateway
          docker push visun12/api-gateway
          
          docker build -t visun12/identity-service ./infrastructure-services/identity-service
          docker push visun12/identity-service
          
          # Domain Services
          docker build -t visun12/crop-service ./domain-services/crop-service
          docker push visun12/crop-service
          
          docker build -t visun12/zone-service ./domain-services/zone-service
          docker push visun12/zone-service
          
          docker build -t visun12/sensor-service ./domain-services/sensor-service
          docker push visun12/sensor-service
          
          docker build -t visun12/automation-service ./domain-services/automation-service
          docker push visun12/automation-service

